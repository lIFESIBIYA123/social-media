services:
  nginx:
    image: nginx:latest
    restart: on-failure
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - uploads_volume:/app/uploads
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: .
    restart: always
    env_file: .env
    command: >
      sh -c "python manage.py migrate --no-input &&
             gunicorn CoreRoot.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - uploads_volume:/app/uploads
    depends_on:
      - db

  db:
    image: postgres:14.3-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  uploads_volume:
  postgres_data:
