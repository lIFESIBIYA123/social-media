name: Build, Test and Deploy Postgram

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Inject test environment variables
        run: |
          echo "SECRET_KEY=test_foo" >> .env
          echo "DATABASE_NAME=test_coredb" >> .env
          echo "DATABASE_USER=test_core" >> .env
          echo "DATABASE_PASSWORD=12345678" >> .env
          echo "DATABASE_HOST=test_postagram_db" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "POSTGRES_USER=test_core" >> .env
          echo "POSTGRES_PASSWORD=12345678" >> .env
          echo "POSTGRES_DB=test_coredb" >> .env
          echo "ENV=TESTING" >> .env
          echo "DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost" >> .env

      - name: Build containers
        run: | 
          docker compose up -d --build
          docker compose exec -T api wait-for-it db:5432 -t 60

      - name: Running Testss
        run: | 
          docker compose exec -T api pytest -v --tb=short

      - name: check logs
        if: failure()
        run: docker compose logs

      - name: run migration
        run: docker composw exec -T api python manage.py migrate
          
